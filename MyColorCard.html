<!DOCTYPE=html>
    <html lang="en">

    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width,initial-scale=1.0">
        <title>My Color Cards </title>
        <style>
            /*Universal selector applies to everything on page*/
            * {
                font-size: 16px
            }

            /*Elements selector*/
            body {
                background-color: lightyellow;
            }

            h1 {
                color: darkblue;
            }

            h2 {
                color: purple;
            }

            p {
                color: dimgrey
            }

            /*Class selector*/
            .my-detail {
                color: darkolivegreen;
                font-weight: bold;
            }

            /* ID selector */
            #my-card {
                background-color: lightcyan;

            }
        </style>
    </head>

    <body>
        <h1>My Color card</h1>
        <p style="color:darkblue">This is my webpage</p>
        <div id="my-card">
            <h2>About me</h2>
            <p class="my-detail">My name is Sam.</p>
            <p class="my-detail">My favorite color is red</p>
            <p class="my-detail">My favorite food is pasta</p>
        </div>
        <h2>My favoite things</h2>
        <p>MY favourite animal is turtle</p>
        <p>My favourite sport is football</p>
        <p>My favourite movie is The Avengers </p>
    </body>

    </html>
